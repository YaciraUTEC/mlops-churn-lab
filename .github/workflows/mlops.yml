
name: MLOps Pipeline - Churn Predictor

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'app/**'
      - 'tests/**'
      - 'configs/**'
      - 'data/telco_customer_churn_mlops.csv'
      - 'requirements*.txt'
      - '.github/workflows/mlops.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.10'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar tests
        run: pytest tests/ -v --tb=short

  data-validation:
    name: Data Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validar contrato de datos
        run: python src/validate_data.py

      - name: Subir reporte de validacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-validation-report
          path: reports/data_validation.json

  data-prep:
    name: Data Preparation
    runs-on: ubuntu-latest
    needs: data-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: Preparar datos
        run: python src/data_prep.py

      - uses: actions/upload-artifact@v4
        with:
          name: data-prep-artifacts
          path: data/

  train:
    name: Modeling
    runs-on: ubuntu-latest
    needs: data-prep
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: data-prep-artifacts
          path: data/

      - name: Entrenar baseline y cuatro candidatos
        run: python src/train.py --model all

      - uses: actions/upload-artifact@v4
        with:
          name: train-artifacts
          path: |
            mlruns/
            data/

  evaluate:
    name: Evaluation
    runs-on: ubuntu-latest
    needs: train
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: train-artifacts
          path: .

      - name: Evaluar y registrar modelo
        run: python src/evaluate_and_register.py

      - name: Resumen de evaluacion
        if: always()
        run: |
          if [ -f reports/model_card.md ]; then
            cat reports/model_card.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f reports/evaluation_report.json ]; then
            echo "## Quality gate no superado" >> "$GITHUB_STEP_SUMMARY"
            cat reports/evaluation_report.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir reportes y modelo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-artifacts
          retention-days: 30
          path: |
            data/
            reports/
